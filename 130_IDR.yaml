# environment.yaml/yml file for IDR gpu project
# mamba env create -f environment.yaml

name: idr
channels:
  - conda-forge
  - pytorch
channel_priority: flexible

dependencies:
  # Exact patch version that was tested. If this build has been pruned from
  # conda-forge, relax to `python=3.13`.
  - python=3.13.1
  - pip

  - pip:
      # --- pytorch stack (tested versions; CUDA 13.0 variant) ---
      # The `+cu130` local tag exists only on the pytorch wheel index, so the index
      # must be declared alongside it. `--extra-index-url` (not `--index-url`) keeps
      # PyPI available for the non-torch packages below; `+cu130` disambiguates
      # torch itself, since PyPI has no such local version.
      - --extra-index-url https://download.pytorch.org/whl/cu130
      - torch==2.13.0+cu130
      - torchvision==0.28.0+cu130
      - torchaudio==2.11.0+cu130
      - triton==3.7.1

      - lightning==2.6.1
      - torchmetrics==1.8.2

      # --- hydra ---
      - hydra-core==1.3.2
      - hydra-colorlog==1.2.0
      - omegaconf==2.3.0
      - antlr4-python3-runtime==4.9.3
      - rootutils==1.0.7

      # --- data / science ---
      - numpy==2.2.2
      - pandas==2.2.3
      - h5py            
      - pyarrow>=15
      - scikit-learn==1.6.1
      - scipy==1.15.1
      - matplotlib==3.10.0
      - seaborn==0.13.2

      # --- structure / sequence IO 
      - biopython==1.86
      - biotite==1.6.0
      - requests==2.32.5
      - tqdm==4.67.1

      # --- embeddings---
      # fair-esm (ESM-2 backend), as in the tested env. NOTE: do not also install
      # biohub `esm`; both libraries claim the top-level module name `esm`.
      - fair-esm==2.0.0
      - transformers==4.48.1
      - sentencepiece==0.2.1
      - einops==0.8.2
      - huggingface-hub==0.36.0

      # --- misc ---
      - rich==15.0.0
      - pyyaml==6.0.3
      - python-dotenv==1.0.1
      - pytest
